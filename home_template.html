<section class="home-intro">
    <div class="intro-topline"><span class="eyebrow">INDEPENDENT PHOTOGRAPHIC WORK</span><span class="eyebrow">$period</span></div>
    <div class="intro-hero">
        <h1>Photographic<br>archive.</h1>
        <div class="sensor-art">
            <div class="sensor-field" aria-hidden="true">
                <div class="sensor-fallback"></div>
                <canvas class="sensor-canvas" data-sensor-pattern></canvas>
            </div>
        </div>
    </div>
    <div class="intro-bottom"><span class="eyebrow">SELECTED COLLECTIONS / $count</span></div>
</section>
<script src="/js/sensor.js" defer></script>
<section class="project-index" aria-label="Selected projects">
    <div class="project-list">
        <div class="index-heading"><span>NO.</span><span>PROJECT INDEX</span><span>YEAR</span><span aria-hidden="true">↙</span></div>
        $rows
        $all_link
    </div>
    <aside class="preview-panel" aria-label="Project preview">
        <div class="preview-topline"><span>SELECTED VIEW</span><span aria-hidden="true">[ + ]</span></div>
        $preview
    </aside>
</section>
