<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>$title</title>
    <meta name="description" content="$description">
    <link rel="icon" href="/photos/_site_images/logo.webp" type="image/webp">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
        (() => {
            try {
                const saved = localStorage.getItem('theme');
                const theme = saved === 'light' || saved === 'dark'
                    ? saved
                    : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.dataset.theme = theme;
            } catch {}
        })();
    </script>
    <link rel="stylesheet" href="/css/styles.css">
    <script src="/js/script.js" defer></script>
</head>
<body class="$page_class">
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
        <a class="wordmark" href="/"><span class="square" aria-hidden="true"></span>Jack Simpson</a>
        <nav aria-label="Main navigation">$navigation</nav>
        <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch to dark mode" title="Switch to dark mode">
            <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.4 15.2A8.5 8.5 0 0 1 8.8 3.6 8.5 8.5 0 1 0 20.4 15.2Z"/></svg>
            <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <span class="header-note" aria-hidden="true">PHOTOGRAPHIC ARCHIVE</span>
    </header>
    <main id="main" tabindex="-1">$content</main>
    <footer class="site-footer"><span>© Jack Simpson</span><span>Independent photographic work</span><a href="#main">Back to top ↑</a></footer>
    $lightbox
</body>
</html>
