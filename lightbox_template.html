<dialog id="lightbox" aria-labelledby="lb-title">
    <div class="lightbox-header"><h2 id="lb-title">Photograph</h2><button id="lb-close" type="button" aria-label="Close image viewer" autofocus>Close ×</button></div>
    <div class="lightbox-stage"><img id="lb-img" alt=""><p id="lb-status" role="status" aria-live="polite"></p></div>
    <div class="lightbox-footer"><div class="lightbox-caption"><span id="lb-filename"></span><p id="lb-metadata"></p></div>
        <div class="lightbox-controls"><button id="lb-prev" type="button" aria-label="Previous photograph">←</button><span id="lb-counter" aria-live="polite"></span><button id="lb-next" type="button" aria-label="Next photograph">→</button></div>
    </div>
</dialog>
